<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>起始页 · chengicli</title>
  <meta name="description" content="chengicli 的浏览器起始页：搜索与常用站点。">
  <meta name="theme-color" content="#fafafa" id="meta-theme-color">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* 首帧定色：避免刷新时先亮后暗闪一下 */
    (function () {
      try {
        var saved = localStorage.getItem('nav-theme');
        var h = new Date().getHours();
        var theme = (saved === 'light' || saved === 'dark') ? saved : ((h >= 19 || h < 7) ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/External-link/css/lxgw/lxgwwenkaigbscreen.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/External-link/css/lxgw/lxgwwenkaigbscreen.css"></noscript>
  <link rel="stylesheet" href="/start/assets/css/style.css?v=20261125-editor10">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-mask" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="/" title="回博客首页">
      <img class="brand-avatar" src="/assets/avatar.webp" alt="chengicli" width="38" height="38">
      <span class="brand-text">
        <strong>chengicli</strong>
        <em>晚安😴💤</em>
      </span>
    </a>
    <nav class="top-actions" aria-label="页面操作">
      <button class="icon-btn" id="edit-toggle" type="button" aria-label="编辑站点" aria-pressed="false">
        <svg class="ico ico-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <svg class="ico ico-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色模式">
        <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <a class="icon-btn" href="/" aria-label="回到博客">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <p class="greet"><span id="greet">你好</span>，chengicli</p>
      <div class="clock" aria-label="当前时间">
        <span id="clock-time">--:--</span><span class="clock-sec" id="clock-sec">--</span>
      </div>
      <p class="date" id="date">—</p>
      <p class="tagline"><span id="typewriter"></span><span class="caret" aria-hidden="true"></span></p>
    </section>

    <section class="search-area" aria-label="搜索">
      <form class="search" id="search-form" role="search" autocomplete="off">
        <button class="engine" id="engine-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="选择搜索引擎">
          <span id="engine-name">Bing</span>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <input class="search-input" id="search-input" type="search" placeholder="搜索，或直接输入网址" aria-label="搜索关键词" spellcheck="false" autocomplete="off">
        <button class="search-go" type="submit" aria-label="开始搜索">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </form>
      <div class="engine-menu" id="engine-menu" role="listbox" aria-label="搜索引擎" hidden></div>
      <p class="hint">按 <kbd>/</kbd> 聚焦搜索 · 网址直接回车即可跳转</p>
    </section>

    <section class="groups" id="groups" aria-label="常用站点"></section>
  </main>

  <footer class="footer">
    <p class="ft-line ft-meta">
      <span id="ftRun">站点运行 <b>—</b></span>
      <span class="ft-flower">｡･ﾟﾟ･🌸･ﾟﾟ･｡</span>
      <span id="ftLove">已经和女朋友<b>—</b>啦</span>
      <svg class="ft-love-heart" width="30" height="27" viewBox="0 0 30 27" aria-hidden="true">
        <defs>
          <clipPath id="ft-love-clip">
            <path d="M15 26C15 26 2 17.5 2 9.5 2 5.5 5 3 8.5 3 11.2 3 13.4 4.4 15 6.5 16.6 4.4 18.8 3 21.5 3 25 3 28 5.5 28 9.5 28 17.5 15 26 15 26Z"/>
          </clipPath>
          <linearGradient id="ft-love-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff8fb3"/>
            <stop offset="1" stop-color="#ff2e63"/>
          </linearGradient>
        </defs>
        <g class="ft-love-clip">
          <rect class="ft-love-base" x="0" y="0" width="30" height="27"/>
          <rect class="ft-love-bar b1" x="3.4" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b2" x="6.1" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b3" x="8.8" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b4" x="11.5" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b5" x="14.2" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b6" x="16.9" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b7" x="19.6" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b8" x="22.3" y="0" width="2.55" height="26"/>
          <rect class="ft-love-bar b9" x="25" y="0" width="2.55" height="26"/>
        </g>
      </svg>
    </p>
    <p class="ft-line ft-copy">
      <span>© 2023-<span id="year">2026</span> By chengicli</span>
      <span class="ft-dot">·</span>
      <a class="ft-icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"><span class="ft-icp-icon" aria-hidden="true"></span>豫ICP备2026057580号</a>
      <span class="ft-dot">·</span>
      <a class="ft-icp ft-police" href="https://beian.mps.gov.cn/#/query/webSearch?code=32040002010816" target="_blank" rel="noopener noreferrer"><span class="ft-police-icon" aria-hidden="true"></span>苏公网安备32040002010816号</a>
    </p>
  </footer>

  <div class="edit-bar" id="edit-bar" hidden>
    <button type="button" id="btn-add-site">＋ 添加站点</button>
    <button type="button" id="btn-export">导出</button>
    <button type="button" id="btn-import">导入</button>
    <button type="button" id="btn-reset">恢复默认</button>
    <button type="button" id="btn-done">完成修改</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>

  <div class="sheet" id="site-sheet" hidden>
    <div class="sheet-mask" data-close-sheet></div>
    <form class="sheet-panel" id="site-form" autocomplete="off">
      <h3 id="sheet-title">添加站点</h3>
      <label class="field"><span>名称</span><input id="f-name" maxlength="24" required placeholder="例如：GitHub"></label>
      <label class="field"><span>网址</span><input id="f-url" maxlength="300" required placeholder="https://github.com/"></label>
      <label class="field"><span>备注</span><input id="f-note" maxlength="40" placeholder="可选，显示在名称下方"></label>
      <div class="field">
        <span>分组</span>
        <div class="dropdown">
          <button type="button" class="dropdown-btn" id="f-group-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="dropdown-value">—</span>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu" id="f-group-menu" role="listbox" hidden></div>
        </div>
      </div>
      <label class="field" id="f-newgroup-wrap" hidden><span>新分组名</span><input id="f-newgroup" maxlength="20" placeholder="例如：工作"></label>
      <div class="sheet-actions">
        <button type="button" class="btn-ghost" data-close-sheet>取消</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>

  <div class="sheet" id="group-sheet" hidden>
    <div class="sheet-mask" data-close-group-sheet></div>
    <form class="sheet-panel" id="group-form" autocomplete="off">
      <h3>编辑分组</h3>
      <label class="field"><span>分组名称</span><input id="g-name" maxlength="20" required placeholder="例如：工作"></label>
      <label class="field"><span>分组描述</span><input id="g-desc" maxlength="40" placeholder="可选，显示在分组名右边"></label>
      <div class="sheet-actions">
        <button type="button" class="btn-ghost" data-close-group-sheet>取消</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>

  <script src="/start/assets/js/app.js?v=20261125-editor17" defer></script>
</body>
</html>
