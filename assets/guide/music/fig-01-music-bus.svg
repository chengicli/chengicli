<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="音乐胶囊单例播放核心结构图">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#f7f8fa"/>
  <text x="40" y="52" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="23" font-weight="700" fill="#1f2937">音乐胶囊的本质：一个 audio，一套状态，多个界面</text>
  <text x="40" y="84" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" fill="#4b5563">不需要 APlayer / MetingJS；原生 audio + 自建 bus + 一个固定定位的 div 就够。</text>

  <g transform="translate(330,190)">
    <rect width="240" height="150" rx="18" fill="#ffffff" stroke="#db2777" stroke-width="3"/>
    <text x="120" y="42" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#db2777">music-bus.js</text>
    <text x="120" y="76" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#1f2937">一个 &lt;audio&gt;</text>
    <text x="120" y="106" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#4b5563">队列 · 当前索引 · 播放状态</text>
    <text x="120" y="130" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#4b5563">歌词行 · 时间 · 音量</text>
  </g>

  <g font-family="'Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#4b5563">
    <line x1="330" y1="215" x2="190" y2="150" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="265" x2="190" y2="330" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="215" x2="710" y2="150" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="265" x2="710" y2="330" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="40" y="115" width="180" height="72" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="130" y="145" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">左下角胶囊</text>
    <text x="130" y="168" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#6b7280">竖排歌词 + 三个按钮</text>

    <rect x="40" y="295" width="180" height="72" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="130" y="325" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">侧栏悬停面板</text>
    <text x="130" y="348" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#6b7280">可选增强，不是必需</text>

    <rect x="680" y="115" width="180" height="72" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="770" y="145" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">/music/ 音乐馆</text>
    <text x="770" y="168" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#6b7280">歌单列表 + 控制条</text>

    <rect x="680" y="295" width="180" height="72" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="770" y="325" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">pjax 换页</text>
    <text x="770" y="348" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#6b7280">audio 不销毁，继续播</text>
  </g>
</svg>
