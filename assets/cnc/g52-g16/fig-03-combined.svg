<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="G52 加 G16 组合加工示意图">
  <rect width="900" height="460" fill="#f7f8fa"/>
  <text x="40" y="52" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="23" font-weight="700" fill="#1f2937">G52 + G16：先搬工位，再画孔圈</text>
  <text x="40" y="84" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" fill="#4b5563">G52 负责把局部原点放到每组孔系中心；G16 负责在这个中心周围按半径和角度定位。</text>

  <g transform="translate(70,140)">
    <rect x="0" y="0" width="330" height="240" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <g fill="#e5e7eb">
      <rect x="40" y="35" width="105" height="70" rx="8"/>
      <rect x="185" y="35" width="105" height="70" rx="8"/>
      <rect x="40" y="135" width="105" height="70" rx="8"/>
      <rect x="185" y="135" width="105" height="70" rx="8"/>
    </g>
    <g fill="none" stroke="#2563eb" stroke-width="2.5">
      <circle cx="92.5" cy="70" r="22"/>
      <circle cx="237.5" cy="70" r="22"/>
      <circle cx="92.5" cy="170" r="22"/>
      <circle cx="237.5" cy="170" r="22"/>
    </g>
    <g fill="#db2777">
      <circle cx="92.5" cy="70" r="4"/>
      <circle cx="237.5" cy="70" r="4"/>
      <circle cx="92.5" cy="170" r="4"/>
      <circle cx="237.5" cy="170" r="4"/>
    </g>
    <text x="165" y="230" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#4b5563">四组孔系 · 同一个子程序</text>
  </g>

  <g transform="translate(470,155)">
    <rect width="360" height="220" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="24" y="42" font-family="Consolas,monospace" font-size="16" fill="#db2777">G52 X100. Y50.</text>
    <text x="24" y="72" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#4b5563">把局部原点搬到第 1 组中心</text>
    <text x="24" y="112" font-family="Consolas,monospace" font-size="16" fill="#2563eb">G16</text>
    <text x="24" y="142" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#4b5563">按 R40 / 角度 0°、90°…定位</text>
    <text x="24" y="182" font-family="Consolas,monospace" font-size="16" fill="#db2777">M98 P9001</text>
    <text x="24" y="206" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#6b7280">调用同一个 4 孔子程序</text>
  </g>
</svg>
